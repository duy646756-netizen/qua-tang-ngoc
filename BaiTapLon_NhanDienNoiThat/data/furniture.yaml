# ============================================================================
# Cấu hình bộ dữ liệu cho train.py và evaluate.py
#
# Cấu trúc thư mục cần chuẩn bị (xem README mục 6):
#   data/
#     images/train/anh001.jpg ...      labels/train/anh001.txt ...
#     images/val/anh900.jpg  ...       labels/val/anh900.txt  ...
#
# Mỗi tệp .txt là nhãn của ảnh cùng tên, mỗi dòng một vật thể:
#   <id_lop> <x_tam> <y_tam> <chieu_rong> <chieu_cao>      (giá trị 0–1)
# ============================================================================

path: .            # thư mục gốc, tính từ vị trí của tệp yaml này
train: images/train
val: images/val

# Danh sách lớp. 16 lớp đầu giữ nguyên tên COCO để tận dụng mô hình có sẵn,
# 7 lớp cuối là phần bổ sung mà COCO không có — đây là giá trị thêm vào của bài.
names:
  0: bench
  1: chair
  2: couch
  3: potted plant
  4: bed
  5: dining table
  6: toilet
  7: tv
  8: microwave
  9: oven
  10: toaster
  11: sink
  12: refrigerator
  13: book
  14: clock
  15: vase
  16: wardrobe
  17: desk
  18: lamp
  19: shelf
  20: mirror
  21: curtain
  22: carpet
